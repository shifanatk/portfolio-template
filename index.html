<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shifana T K | Software Developer</title>
  <meta name="description" content="Portfolio of Shifana T K, software developer focused on AI and system applications.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="#top" id="logo" aria-label="Home"></a>
    <div class="nav-links"><a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#experience" id="navExp">Experience</a><a href="#contact">Contact</a></div>
    <button id="theme" class="icon-btn" aria-label="Toggle dark and light mode"></button>
  </nav>
  <main id="top">
    <header class="hero" id="hero">
      <p class="status"><span class="dot"></span><span id="status"></span></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="now" id="now"></p>
      <p class="hint">Move your cursor over the name</p>
    </header>
    <section class="sec" id="about"><h2>About</h2><div><p class="lead" id="bio"></p><div class="card edu" id="edu"></div></div></section>
    <section class="sec" id="skills"><h2>Skills</h2><div class="skill-grid" id="skillGrid"></div></section>
    <section class="sec" id="projects"><h2>Projects</h2><div class="stack" id="projectList"></div></section>
    <section class="sec" id="experience"><h2>Experience</h2><div class="tl" id="expList"></div></section>
  </main>
  <footer class="sec" id="contact">
    <h2>Contact</h2>
    <div><p class="lead">Looking for an intern who ships? Let's talk.</p><nav class="links" id="links" aria-label="Profile links"></nav>
    <p class="fine">Built with plain HTML, CSS and JS. Content lives in <code>profile.json</code>.</p></div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
